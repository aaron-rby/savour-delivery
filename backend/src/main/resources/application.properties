# ============================================================================
# SAVOUR FOOD DELIVERY SYSTEM — BACSE202 Spring Boot Configuration
# ============================================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Active Profile: 'oracle' by default, or 'test' during automated unit tests
spring.profiles.active=${APP_PROFILE:dev}

# Oracle JDBC Connection Settings (Override via Environment Variables)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USER:savour_user}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SavourOraclePool

# Do not initialize embedded schema automatically in production
spring.sql.init.mode=never

# Logging
logging.level.com.savour.fooddelivery=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
